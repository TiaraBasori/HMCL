name: Sync Upstream

# Manual only — never scheduled, never triggered by push.
# Merges HMCL-dev/HMCL into this branch. The fork changes are committed in the source tree,
# so conflicts are resolved here (the merge prefers upstream on conflicting hunks; re-check
# the diffs listed below afterwards).
#
# Usage: gh workflow run sync-upstream.yml -f branch=main
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync'
        required: true
        default: 'main'
      push:
        description: 'Push the merge result'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "TiaraBasori"
          git config user.email "mintabyss233@gmail.com"

      - name: Merge upstream
        run: |
          git remote add upstream https://github.com/HMCL-dev/HMCL.git || true
          git fetch upstream main
          git merge --no-edit upstream/main || true

      # The fork edits these files; upstream edits them too, so a merge can silently drop
      # a change (upstream wins on conflicts). Fail loudly instead of shipping a broken build.
      - name: Check fork changes survived the merge
        run: |
          fail=0
          check() {
            if git grep -q "$1" -- "$2"; then
              echo "OK   $2"
            else
              echo "::error::$2 no longer contains '$1' — the fork change was lost in the merge"
              fail=1
            fi
          }
          check 'boxMethods.getChildren().setAll(title, microsoftItem, offlineItem, boxAuthServers);' 'HMCL/src/main/java/org/jackhuang/hmcl/ui/account/AccountListPage.java'
          check 'this.getChildren().setAll(root);' 'HMCL/src/main/java/org/jackhuang/hmcl/ui/download/VersionsPage.java'
          check 'this.getChildren().setAll(pane);' 'HMCL/src/main/java/org/jackhuang/hmcl/ui/instances/DownloadListPage.java'
          exit $fail

      - name: Commit and push
        if: inputs.push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit --author="TiaraBasori <mintabyss233@gmail.com>" -m "Sync upstream"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${{ inputs.branch }})" ]; then
            git push origin HEAD:${{ inputs.branch }}
          else
            echo "Already up to date"
          fi
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
