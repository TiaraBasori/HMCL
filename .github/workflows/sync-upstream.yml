name: Sync Upstream

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Backup custom workflows and patches
        run: |
          mkdir -p /tmp/workflows_backup
          cp .github/workflows/sync-upstream.yml /tmp/workflows_backup/ 2>/dev/null || true
          cp .github/workflows/release-build.yml /tmp/workflows_backup/ 2>/dev/null || true
          cp -r .github/workflows/patches /tmp/workflows_backup/ 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/HMCL-dev/HMCL.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream (keep upstream version for conflicts)
        run: |
          git merge -X theirs upstream/main --no-edit || true

      - name: Drop upstream workflows this fork does not use
        run: |
          git rm -f --ignore-unmatch -- \
            .github/workflows/mirror.yml \
            .github/workflows/release.yml \
            .github/workflows/pr-size-label.yml \
            .github/workflows/check-codes-comment.yml \
            .github/scripts/pr-size-label.js \
            .github/scripts/check-codes-comment.js

      - name: Restore custom workflows
        run: |
          cp /tmp/workflows_backup/sync-upstream.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/workflows_backup/release-build.yml .github/workflows/ 2>/dev/null || true
          mkdir -p .github/workflows/patches
          cp -r /tmp/workflows_backup/patches/. .github/workflows/patches/ 2>/dev/null || true

      - name: Restore fork README
        run: |
          cp /tmp/workflows_backup/patches/README.md README.md 2>/dev/null || true

      - name: Reset patched files to upstream version
        run: |
          git checkout upstream/main -- HMCL/src/main/java/org/jackhuang/hmcl/ui/account/AccountListPage.java
          git checkout upstream/main -- HMCL/src/main/java/org/jackhuang/hmcl/setting/Accounts.java
          git checkout upstream/main -- HMCL/src/main/java/org/jackhuang/hmcl/ui/account/CreateAccountPane.java
          git checkout upstream/main -- HMCL/src/main/java/org/jackhuang/hmcl/ui/main/MainPage.java
          git checkout upstream/main -- HMCL/src/main/java/org/jackhuang/hmcl/upgrade/IntegrityChecker.java
          git checkout upstream/main -- HMCL/build.gradle.kts

      - name: Fail on unresolved conflicts
        run: |
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge conflicts: $unresolved"
            exit 1
          fi

      - name: Apply patches
        run: |
          python3 .github/workflows/patches/apply_patches.py

      - name: Commit and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream and re-apply fork patches"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin main
          else
            echo "Already up to date"
          fi
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
