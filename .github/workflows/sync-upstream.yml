name: Sync Upstream

# Local / manual maintenance only.
# This workflow deliberately has NO schedule and NO push: automation must not merge or rewrite main.
# Run it from a checkout on your own machine:
#   gh workflow run sync-upstream.yml            # via Actions, manual dispatch
#   or: bash .github/workflows/scripts/sync-upstream.sh
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "TiaraBasori"
          git config user.email "mintabyss233@gmail.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/HMCL-dev/HMCL.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream (keep upstream version for conflicts)
        run: |
          git merge -X theirs upstream/main --no-edit || true

      - name: Drop upstream workflows this fork does not use
        run: |
          git rm -f --ignore-unmatch -- \
            .github/workflows/mirror.yml \
            .github/workflows/release.yml \
            .github/workflows/pr-size-label.yml \
            .github/workflows/check-codes-comment.yml \
            .github/scripts/pr-size-label.js \
            .github/scripts/check-codes-comment.js

      - name: Drop stray patch artifacts
        run: git rm -f --ignore-unmatch -- '*.orig' '*.rej'

      - name: Restore fork README
        run: git checkout upstream/main -- README.md 2>/dev/null || true && cp .github/workflows/patches/README.md README.md

      - name: Fail on unresolved conflicts
        run: |
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge conflicts: $unresolved"
            exit 1
          fi

      - name: Commit and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit --author="TiaraBasori <mintabyss233@gmail.com>" -m "Sync upstream"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin main
          else
            echo "Already up to date"
          fi
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
