name: Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG_PREFIX: build
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: HMCL-dev/HMCL
          ref: main
          fetch-depth: 0
          path: src

      - name: Checkout fork configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 1
          path: fork

      # Build only: this job never commits, merges or pushes to any repository.
      # Fork patches live in the fork repo and are applied to the pristine upstream tree.
      - name: Apply fork patches to the upstream tree
        working-directory: src
        run: |
          mkdir -p .github/workflows
          cp -r ../fork/.github/workflows/patches .github/workflows/
          python3 .github/workflows/patches/apply_patches.py
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build with Gradle
        working-directory: src
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          VERSION_TYPE: stable

      - name: Get version
        working-directory: src
        run: |
          VERSION=$(./gradlew properties --no-daemon -q | grep "^version:" | cut -d' ' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp src/HMCL/build/libs/HMCL-*.jar artifacts/HMCL.jar
          cp src/HMCL/build/libs/HMCL-*.exe artifacts/HMCL.exe
          cp src/HMCL/build/libs/HMCL-*.sh artifacts/HMCL.sh
          cp src/HMCL/build/libs/HMCL-*.deb artifacts/HMCL.deb
          ls -la artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for f in HMCL.jar HMCL.exe HMCL.sh HMCL.deb; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create release
        working-directory: fork
        run: |
          TAG="${{ env.RELEASE_TAG_PREFIX }}-${{ env.VERSION }}-${{ env.SHORT_SHA }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" ../artifacts/* \
            --title "HMCL ${{ env.VERSION }}-${{ env.SHORT_SHA }}" \
            --notes "HMCL ${{ env.VERSION }} built from HMCL-dev/HMCL@${{ github.sha }} with the fork patches applied in the build workspace only. The repository is not modified."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
