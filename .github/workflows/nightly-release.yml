name: Nightly Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --parallel
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Get version
        run: |
          VERSION=$(./gradlew properties --no-daemon -q | grep "^version:" | cut -d' ' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp HMCL/build/libs/HMCL-*.jar artifacts/ 2>/dev/null || true
          cp HMCL/build/libs/HMCL-*.exe artifacts/ 2>/dev/null || true
          cp HMCL/build/libs/HMCL-*.sh artifacts/ 2>/dev/null || true
          cp HMCL/build/libs/HMCL-*.deb artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create nightly release
        run: |
          TAG="nightly-${{ env.VERSION }}-${{ env.SHORT_SHA }}"
          gh release create "$TAG" artifacts/* \
            --title "HMCL Nightly $TAG" \
            --notes "Nightly build from commit ${{ github.sha }}" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
